<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Methods</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1b4332, #0d2818);
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            color: #f1faee;
            padding: 20px;
        }

        .board {
            width: 100%;
            max-width: 920px;
        }

        h1.title {
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 1.4rem;
            color: #ffd166;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            opacity: 0.7;
            font-size: 0.85rem;
            margin: 0 0 8px;
        }

        .turn-indicator {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            opacity: 0.9;
            margin-bottom: 20px;
            min-height: 22px;
        }

        .row {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 16px;
            flex-wrap: wrap;
        }

        .team {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s, transform 0.3s;
            border-color: var(--team-color-dim);
        }

        .team.active {
            transform: translateY(-6px);
            border-color: var(--team-color);
            box-shadow: 0 0 24px var(--team-color-glow);
        }

        .team h4 {
            margin: 0 0 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .total {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0 0 8px;
            color: var(--team-color);
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.76rem;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        /* Dice - just shows the number, since 12-sided pip patterns get messy */
        .dice {
            width: 70px;
            height: 70px;
            margin: 0 auto 8px;
            background: #f1faee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.3s;
        }

        .dice.rolling {
            animation: shake 0.15s infinite;
        }

        .dice.double {
            box-shadow: 0 0 0 3px #ffd166, 0 0 18px 4px rgba(255, 209, 102, 0.7);
        }

        @keyframes shake {
            0% {
                transform: rotate(-6deg);
            }

            50% {
                transform: rotate(6deg);
            }

            100% {
                transform: rotate(-6deg);
            }
        }

        .dice-num {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1b4332;
        }

        .double-msg {
            min-height: 18px;
            font-weight: bold;
            font-size: 0.8rem;
            color: #ffd166;
            margin-bottom: 8px;
        }

        button {
            background: #ffd166;
            border: none;
            color: #1b4332;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.15s, opacity 0.15s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Winner banner */
        .banner {
            display: none;
            text-align: center;
            margin-top: 28px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 209, 102, 0.15);
            border: 2px solid #ffd166;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd166;
        }

        .banner.show {
            display: block;
        }

        .reset {
            display: block;
            margin: 16px auto 0;
        }
    </style>
</head>

<body>
    <div class="board">
        <h1 class="title">Number Methods</h1>
        <p class="subtitle">First to 50 points wins</p>
        <p class="turn-indicator" id="turnIndicator"></p>

        <div class="row" id="teamsRow"></div>

        <div class="banner" id="banner"></div>
        <button class="reset" id="reset_btn" style="display:none;">Play Again</button>
    </div>

    <script>

        // Challenge (Part 3): instead of separate variables/ids for every team
        // (total_number_1, total_number_2, teamA_turns, teamB_turns, ...) all
        // team state lives in one array of objects. Adding a team = adding one
        // object to this array; every function below loops over the array
        // instead of repeating logic per team.
        const WIN_SCORE = 50   // task 4: first to reach this wins immediately
        const DICE_SIDES = 12  // task 1: 12-sided dice

        let teams = [
            { id: "A", name: "Team A", color: "#e63946", total: 0, turns: 0, best: null, worst: null },
            { id: "B", name: "Team B", color: "#457b9d", total: 0, turns: 0, best: null, worst: null },
            { id: "C", name: "Team C", color: "#2a9d8f", total: 0, turns: 0, best: null, worst: null },
        ]

        let turnIndex = 0     // which team in the array goes next
        let gameOver = false

        let teamsRow = document.getElementById("teamsRow")
        let turnIndicator = document.getElementById("turnIndicator")
        let banner = document.getElementById("banner")
        let reset_btn = document.getElementById("reset_btn")

        let hexToRgb = (hex) => {
            let r = parseInt(hex.slice(1, 3), 16)
            let g = parseInt(hex.slice(3, 5), 16)
            let b = parseInt(hex.slice(5, 7), 16)
            return `${r}, ${g}, ${b}`
        }

        // Build one card's markup for a team object
        let cardHTML = (team) => `
            <div class="team" id="card-${team.id}" style="--team-color:${team.color}; --team-color-dim: rgba(${hexToRgb(team.color)}, 0.3); --team-color-glow: rgba(${hexToRgb(team.color)}, 0.5);">
                <h4>${team.name}</h4>
                <div class="total" id="total-${team.id}">0</div>
                <div class="stats">
                    <span>Turns: <span id="turns-${team.id}">0</span></span>
                    <span>Avg: <span id="avg-${team.id}">0.00</span></span>
                    <span>Best: <span id="best-${team.id}">-</span> &nbsp; Worst: <span id="worst-${team.id}">-</span></span>
                </div>
                <div class="double-msg" id="double-${team.id}"></div>
                <div class="dice" id="dice-${team.id}"><span class="dice-num" id="dicenum-${team.id}">1</span></div>
                <button id="btn-${team.id}" data-team="${team.id}">Roll Dice</button>
            </div>
        `

        // Render all cards once, then grab element references onto each
        // team object so later updates are cheap lookups, not re-renders
        // (a full re-render mid-animation would break the rolling dice).
        let buildBoard = () => {
            teamsRow.innerHTML = teams.map(cardHTML).join("")
            teams.forEach(team => {
                team.el = {
                    card: document.getElementById(`card-${team.id}`),
                    total: document.getElementById(`total-${team.id}`),
                    turns: document.getElementById(`turns-${team.id}`),
                    avg: document.getElementById(`avg-${team.id}`),
                    best: document.getElementById(`best-${team.id}`),
                    worst: document.getElementById(`worst-${team.id}`),
                    doubleMsg: document.getElementById(`double-${team.id}`),
                    dice: document.getElementById(`dice-${team.id}`),
                    diceNum: document.getElementById(`dicenum-${team.id}`),
                    button: document.getElementById(`btn-${team.id}`),
                }
                team.el.button.addEventListener("click", () => rollFor(team))
            })
        }

        let generateNumber = () => {
            let random = Math.random() * DICE_SIDES
            random = Math.ceil(random)
            return random
        }

        let showFace = (team, number) => {
            team.el.diceNum.textContent = number
        }

        let updateAverage = (team) => {
            team.el.avg.innerHTML = team.turns > 0 ? (team.total / team.turns).toFixed(2) : "0.00"
        }

        let updateBestWorst = (team, rollValue) => {
            team.best = team.best === null ? rollValue : Math.max(team.best, rollValue)
            team.worst = team.worst === null ? rollValue : Math.min(team.worst, rollValue)
            team.el.best.innerHTML = team.best
            team.el.worst.innerHTML = team.worst
        }

        let setActiveTeam = () => {
            teams.forEach((team, i) => {
                team.el.card.classList.toggle("active", i === turnIndex && !gameOver)
                team.el.button.disabled = gameOver || i !== turnIndex
            })
            if (!gameOver) {
                turnIndicator.textContent = `${teams[turnIndex].name}'s turn`
            }
        }

        let declareWinner = (team) => {
            gameOver = true
            teams.forEach(t => t.el.button.disabled = true)
            setActiveTeam()
            turnIndicator.textContent = ""
            banner.innerHTML = `🏆 ${team.name} wins with ${team.total} points!`
            banner.classList.add("show")
            reset_btn.style.display = "block"
        }

        let animateRoll = (team, finalNumber, onDone) => {
            team.el.dice.classList.add("rolling")
            let ticks = 0
            let spin = setInterval(() => {
                showFace(team, generateNumber())
                ticks++
                if (ticks > 8) {
                    clearInterval(spin)
                    team.el.dice.classList.remove("rolling")
                    showFace(team, finalNumber)
                    onDone()
                }
            }, 60)
        }

        let rollFor = (team) => {
            if (gameOver) return

            teams.forEach(t => t.el.button.disabled = true)
            team.el.doubleMsg.innerHTML = ""
            team.el.dice.classList.remove("double")

            let diceResult = generateNumber()
            animateRoll(team, diceResult, () => {
                // Task 5: rolling a 6 doubles the points from this turn
                let points = diceResult
                if (diceResult === 6) {
                    points = diceResult * 2
                    team.el.doubleMsg.innerHTML = `Double or nothing! +${points}`
                    team.el.dice.classList.add("double")
                }

                team.total += points
                team.turns += 1
                team.el.total.innerHTML = team.total
                team.el.turns.innerHTML = team.turns
                updateAverage(team)
                updateBestWorst(team, diceResult)

                // Task 4: first to WIN_SCORE wins immediately, even mid-round
                if (team.total >= WIN_SCORE) {
                    declareWinner(team)
                    return
                }

                turnIndex = (turnIndex + 1) % teams.length
                setActiveTeam()
            })
        }

        let resetGame = () => {
            gameOver = false
            turnIndex = 0
            teams.forEach(team => {
                team.total = 0
                team.turns = 0
                team.best = null
                team.worst = null
                team.el.total.innerHTML = 0
                team.el.turns.innerHTML = 0
                team.el.avg.innerHTML = "0.00"
                team.el.best.innerHTML = "-"
                team.el.worst.innerHTML = "-"
                team.el.doubleMsg.innerHTML = ""
                team.el.dice.classList.remove("double")
                showFace(team, 1)
            })
            setActiveTeam()
            banner.classList.remove("show")
            reset_btn.style.display = "none"
        }

        buildBoard()
        setActiveTeam()
        reset_btn.addEventListener("click", resetGame)

    </script>
</body>

</html>
